<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI x Web3 工作流程图 — Week 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #58a6ff, #bc8cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #8b949e;
    margin-bottom: 28px;
  }
  svg { max-width: 100%; height: auto; }

  /* tooltip hover */
  .node-group { cursor: default; }
  .node-group:hover .node-bg { filter: brightness(1.25); }

  @media (max-width: 720px) {
    h1 { font-size: 1.15rem; }
  }
</style>
</head>
<body>

<h1>AI × Web3 最小工作流程</h1>
<p class="subtitle">Week 1 — AI Agent 链上交互流程图</p>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1180" width="820">
  <defs>
    <!-- gradient for AI zone -->
    <linearGradient id="aiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a2332" stop-opacity="0.25"/>
    </linearGradient>
    <!-- gradient for chain zone -->
    <linearGradient id="chainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a20" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2a20" stop-opacity="0.2"/>
    </linearGradient>
    <!-- arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b949e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <!-- shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ============ ZONE BACKGROUNDS ============ -->
  <!-- AI Zone (top) -->
  <rect x="20" y="20" width="780" height="530" rx="16" fill="url(#aiGrad)" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="52" font-size="13" fill="#58a6ff" font-weight="600">🤖 AI 系统区域 — 离链 (Off-chain)</text>
  <text x="40" y="72" font-size="11" fill="#8b949e">无需签名 · 可由 AI 自主执行</text>

  <!-- Human / Wallet Zone (middle) -->
  <rect x="20" y="568" width="780" height="200" rx="16" fill="#2a1f1a" fill-opacity="0.4" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="600" font-size="13" fill="#f0883e" font-weight="600">🧑 人类审核 & 钱包签名 — 受信区域 (Trusted Zone)</text>
  <text x="40" y="620" font-size="11" fill="#8b949e">⚠️ 必须人类确认 · 需要钱包授权</text>

  <!-- On-chain Zone (bottom) -->
  <rect x="20" y="784" width="780" height="376" rx="16" fill="url(#chainGrad)" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="816" font-size="13" fill="#3fb950" font-weight="600">⛓️ 链上区域 — 测试网 (Testnet / On-chain)</text>
  <text x="40" y="836" font-size="11" fill="#8b949e">需交易费 (Gas) · 不可逆 · 可公开验证</text>

  <!-- ============ DOTTED DIVIDERS ============ -->
  <line x1="30" y1="555" x2="790" y2="555" stroke="#58a6ff" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="410" y="548" text-anchor="middle" font-size="10" fill="#58a6ff">▲ AI 自主执行边界 ▲</text>

  <line x1="30" y1="775" x2="790" y2="775" stroke="#f0883e" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="410" y="770" text-anchor="middle" font-size="10" fill="#f0883e">▲ 离链 → 链上 提交边界 ▲</text>

  <!-- ============ NODE 1: USER ============ -->
  <g class="node-group" transform="translate(410,120)">
    <circle class="node-bg" r="42" fill="#1c2128" stroke="#58a6ff" stroke-width="2.5" filter="url(#shadow)"/>
    <text y="-6" text-anchor="middle" font-size="26" fill="#58a6ff">👤</text>
    <text y="16" text-anchor="middle" font-size="13" fill="#e6edf3" font-weight="600">用户</text>
    <!-- annotations -->
    <text x="60" y="-10" font-size="10" fill="#8b949e">发起者 (Initiator)</text>
    <text x="60" y="6" font-size="10" fill="#8b949e">提出需求 / 自然语言指令</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="410" y1="168" x2="410" y2="220" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="428" y="198" font-size="10" fill="#8b949e">自然语言请求</text>

  <!-- ============ NODE 2: AI AGENT ============ -->
  <g class="node-group" transform="translate(410,275)">
    <rect class="node-bg" x="-70" y="-42" width="140" height="84" rx="14" fill="#1c2128" stroke="#bc8cff" stroke-width="2.5" filter="url(#shadow)"/>
    <text y="-10" text-anchor="middle" font-size="26" fill="#bc8cff">🤖</text>
    <text y="18" text-anchor="middle" font-size="14" fill="#e6edf3" font-weight="700">AI Agent</text>
    <!-- side notes -->
    <text x="86" y="-24" font-size="10" fill="#8b949e">执行者 (Executor)</text>
    <text x="86" y="-10" font-size="10" fill="#8b949e">• 解析用户意图</text>
    <text x="86" y="4" font-size="10" fill="#8b949e">• 选择合约 & ABI</text>
    <text x="86" y="18" font-size="10" fill="#8b949e">• 生成交易参数</text>
    <text x="86" y="32" font-size="10" fill="#8b949e">• ⚠️ 不直接签名/发送</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="410" y1="325" x2="410" y2="375" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="428" y="358" font-size="10" fill="#8b949e">交易草案 (Tx Draft)</text>

  <!-- ============ NODE 3: HUMAN REVIEW ============ -->
  <g class="node-group" transform="translate(410,430)">
    <rect class="node-bg" x="-70" y="-42" width="140" height="84" rx="14" fill="#1c2128" stroke="#f0883e" stroke-width="2.5" filter="url(#shadow)"/>
    <text y="-10" text-anchor="middle" font-size="26" fill="#f0883e">🔍</text>
    <text y="18" text-anchor="middle" font-size="14" fill="#e6edf3" font-weight="700">人类审核</text>
    <!-- side notes -->
    <text x="86" y="-24" font-size="10" fill="#8b949e">审核者 (Reviewer)</text>
    <text x="86" y="-10" font-size="10" fill="#8b949e">• 检查合约地址 ✓</text>
    <text x="86" y="4" font-size="10" fill="#8b949e">• 检查函数参数 ✓</text>
    <text x="86" y="18" font-size="10" fill="#8b949e">• 检查 Gas 限额 ✓</text>
    <text x="86" y="32" font-size="10" fill="#8b949e">• ⚠️ 风险点: 误签恶意合约</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="410" y1="480" x2="410" y2="598" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="428" y="530" font-size="10" fill="#f0883e">✅ 人工确认 / ❌ 拒绝修改</text>

  <!-- ============ NODE 4: WALLET SIGNING ============ -->
  <g class="node-group" transform="translate(410,668)">
    <rect class="node-bg" x="-70" y="-42" width="140" height="84" rx="14" fill="#1c2128" stroke="#f0883e" stroke-width="2.5" filter="url(#shadow)"/>
    <text y="-10" text-anchor="middle" font-size="26" fill="#f0883e">🔐</text>
    <text y="18" text-anchor="middle" font-size="14" fill="#e6edf3" font-weight="700">钱包签名</text>
    <!-- side notes -->
    <text x="86" y="-24" font-size="10" fill="#8b949e">签名者 (Signer)</text>
    <text x="86" y="-10" font-size="10" fill="#8b949e">• 私钥签名交易</text>
    <text x="86" y="4" font-size="10" fill="#8b949e">• MetaMask / WalletConnect</text>
    <text x="86" y="18" font-size="10" fill="#8b949e">• 支付 Gas 费</text>
    <text x="86" y="32" font-size="10" fill="#8b949e">• ⚠️ 风险点: 私钥泄露</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="410" y1="718" x2="410" y2="878" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="428" y="800" font-size="10" fill="#58a6ff">🔗 广播交易 (Broadcast Tx)</text>

  <!-- ============ NODE 5: TESTNET EXECUTION ============ -->
  <g class="node-group" transform="translate(410,930)">
    <rect class="node-bg" x="-80" y="-42" width="160" height="84" rx="14" fill="#1c2128" stroke="#3fb950" stroke-width="2.5" filter="url(#shadow)"/>
    <text y="-10" text-anchor="middle" font-size="26" fill="#3fb950">⛏️</text>
    <text y="18" text-anchor="middle" font-size="14" fill="#e6edf3" font-weight="700">测试网执行</text>
    <!-- side notes -->
    <text x="96" y="-24" font-size="10" fill="#8b949e">执行者 (Testnet)</text>
    <text x="96" y="-10" font-size="10" fill="#8b949e">• 共识确认交易</text>
    <text x="96" y="4" font-size="10" fill="#8b949e">• 合约状态变更</text>
    <text x="96" y="18" font-size="10" fill="#8b949e">• 返回 Tx Hash</text>
    <text x="96" y="32" font-size="10" fill="#8b949e">• ⚠️ 风险点: Gas 不足回滚</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="410" y1="980" x2="410" y2="1052" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="428" y="1020" font-size="10" fill="#3fb950">📄 Tx Hash + 事件日志</text>

  <!-- ============ NODE 6: BLOCK EXPLORER ============ -->
  <g class="node-group" transform="translate(410,1100)">
    <rect class="node-bg" x="-80" y="-42" width="160" height="84" rx="14" fill="#1c2128" stroke="#3fb950" stroke-width="2.5" filter="url(#shadow)"/>
    <text y="-10" text-anchor="middle" font-size="26" fill="#3fb950">🔎</text>
    <text y="18" text-anchor="middle" font-size="14" fill="#e6edf3" font-weight="700">区块浏览器验证</text>
    <!-- side notes -->
    <text x="96" y="-24" font-size="10" fill="#8b949e">验证者 (Verifier)</text>
    <text x="96" y="-10" font-size="10" fill="#8b949e">• Etherscan / Sepolia</text>
    <text x="96" y="4" font-size="10" fill="#8b949e">• 确认区块已确认</text>
    <text x="96" y="18" font-size="10" fill="#8b949e">• 检查事件日志</text>
    <text x="96" y="32" font-size="10" fill="#8b949e">• ✅ 最终验证完成</text>
  </g>

  <!-- ============ LEGEND (bottom right) ============ -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="0.85"/>
    <text x="14" y="22" font-size="12" fill="#e6edf3" font-weight="600">图例 Legend</text>
    <circle cx="24" cy="42" r="5" fill="#bc8cff"/>
    <text x="36" y="46" font-size="10" fill="#8b949e">AI 自主执行区域</text>
    <circle cx="24" cy="62" r="5" fill="#f0883e"/>
    <text x="36" y="66" font-size="10" fill="#8b949e">人类确认 / 钱包签名</text>
    <circle cx="24" cy="82" r="5" fill="#3fb950"/>
    <text x="36" y="86" font-size="10" fill="#8b949e">链上执行 / 验证</text>
    <line x1="14" y1="100" x2="40" y2="100" stroke="#f0883e" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="50" y="104" font-size="10" fill="#8b949e">⚠️ 风险边界</text>
    <rect x="14" y="112" width="12" height="8" rx="2" fill="none" stroke="#3fb950" stroke-width="1"/>
    <text x="36" y="120" font-size="10" fill="#8b949e">需交易费 (Gas)</text>
  </g>

  <!-- ============ BOTTOM RISK SUMMARY ============ -->
  <g transform="translate(30, 1140)">
    <text font-size="11" fill="#f85149">
      ⚠️ 关键风险: ① AI 幻觉导致错误参数  ② 恶意合约伪装  ③ 私钥管理不当  ④ 测试网 ≠ 主网安全  ⑤ Gas 估算偏差
    </text>
  </g>
</svg>

</body>
</html>
